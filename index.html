<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff1a1a">
    <meta name="description" content="adspace.ae">
    <meta property="og:title" content="adspace.ae">
    <meta property="og:description" content="adspace.ae">
    <link rel="icon" type="image/jpeg" href="./favicon.jpg">
    <title>adspace.ae</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            background-color: #ff1a1a;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }

        /* Center the logo precisely in the middle of the screen */
        .center-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        .logo-text {
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            font-size: 5rem;
            font-weight: 600;
            text-align: center;
            word-wrap: break-word;
            max-width: 90vw;
            letter-spacing: -1px;
        }

        /* Fix footer to the very bottom */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .logo-text {
                font-size: 2.5rem;
            }
            footer {
                font-size: 12px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="center-container">
        <h1 class="logo-text">adspace.ae</h1>
    </div>

    <footer>
        © 2026 All rights reserved by adspace.ae
    </footer>

</body>

</html>
